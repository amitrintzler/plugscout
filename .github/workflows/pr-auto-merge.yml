name: PR Auto Merge

on:
  workflow_run:
    workflows:
      - CI
      - Security / CodeQL
      - Security / Dependency Review
      - Security / SBOM + Trivy
      - Security / Secrets
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  merge-when-green:
    name: Merge When Checks Pass
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge passing bot PRs
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const prs = run.pull_requests || [];
            if (!prs.length) {
              core.info('No PR attached to this workflow run.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = prs[0].number;
            const runHeadSha = run.head_sha;
            const prResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const pr = prResp.data;
            const author = pr.user?.login || '';
            const repoOwner = owner.toLowerCase();
            const isEligible =
              author.includes('dependabot') ||
              author.includes('github-actions') ||
              author.toLowerCase() === repoOwner ||
              pr.head.ref === 'chore/daily-security-quarantine' ||
              pr.head.ref === 'chore/catalog-sync';

            if (!isEligible) {
              core.info(`Skipping PR #${prNumber} by ${author} (not owner or known bot).`);
              return;
            }

            if (pr.base.ref !== 'main' || pr.draft) {
              core.info(`Skipping PR #${prNumber} (base=${pr.base.ref}, draft=${pr.draft}).`);
              return;
            }

            if (pr.head.sha !== runHeadSha) {
              core.info(`Skipping PR #${prNumber} because head SHA moved from ${runHeadSha} to ${pr.head.sha}.`);
              return;
            }

            const maxAttempts = 12;
            const pollIntervalMs = 15000;

            const loadCheckState = async () => {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: runHeadSha,
                per_page: 100
              });

              const latestByName = new Map();
              for (const check of checkRuns) {
                if (!latestByName.has(check.name)) {
                  latestByName.set(check.name, check);
                }
              }
              const latestChecks = Array.from(latestByName.values());

              const failedConclusions = new Set(['failure', 'timed_out', 'cancelled', 'startup_failure', 'action_required']);
              const failingChecks = latestChecks.filter(
                (check) => check.status === 'completed' && failedConclusions.has(check.conclusion || '')
              );
              const pendingChecks = latestChecks.filter(
                (check) => check.status !== 'completed' || check.conclusion == null
              );

              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: runHeadSha
              });

              return {
                combinedState: combined.data.state,
                latestChecks,
                failingChecks,
                pendingChecks,
                totalCount: combined.data.total_count
              };
            };

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { combinedState, failingChecks, pendingChecks, totalCount } = await loadCheckState();

              if (failingChecks.length || combinedState === 'failure' || combinedState === 'error') {
                core.info(`PR #${prNumber} still failing checks; not merging.`);
                return;
              }

              if (!pendingChecks.length && combinedState !== 'pending') {
                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: prNumber,
                    merge_method: 'squash'
                  });
                  core.info(`Merged PR #${prNumber}.`);
                } catch (error) {
                  core.warning(`Could not merge PR #${prNumber}: ${error.message}`);
                }
                return;
              }

              if (!totalCount) {
                core.info(`PR #${prNumber} has no checks yet; waiting for checks to appear.`);
              } else {
                core.info(`PR #${prNumber} still has pending checks; waiting (${attempt}/${maxAttempts}).`);
              }

              if (attempt < maxAttempts) {
                await sleep(pollIntervalMs);
              }
            }

            core.info(`PR #${prNumber} still has pending checks after ${maxAttempts} attempts; not merging.`);
